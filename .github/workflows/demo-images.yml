# Builds the Virtual Infrastructure demo's three images for AMD64 and ARM64 and pushes them to the
# GitHub Container Registry, on a tag such as `virtual-infrastructure-v0.1.0`:
#
#   ghcr.io/<owner>/virtual-infrastructure-<part>:0.1.0   and   :latest
#
# Each architecture is built on a runner of its own kind, then the two are joined under one name.
name: Demo images

on:
    push:
        tags:
            - 'virtual-infrastructure-v*'

permissions:
    contents: read
    packages: write

env:
    DEMO: virtual-infrastructure

jobs:
    build:
        name: ${{ matrix.part }} (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            matrix:
                part: [data-service, live-server, web]
                arch: [amd64, arm64]
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v4

            - name: Name the image
              run: |
                  echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$DEMO-${{ matrix.part }}" >> "$GITHUB_ENV"
                  echo "VERSION=${GITHUB_REF_NAME#"$DEMO"-v}" >> "$GITHUB_ENV"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: examples/${{ env.DEMO }}/${{ matrix.part }}/Dockerfile
                  push: true
                  # One plain image per architecture, for the next job to join
                  provenance: false
                  tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
                  # Ties the package to this repository on GitHub
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.version=${{ env.VERSION }}

    join:
        name: ${{ matrix.part }}
        needs: build
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                part: [data-service, live-server, web]
        steps:
            - name: Name the image
              run: |
                  echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$DEMO-${{ matrix.part }}" >> "$GITHUB_ENV"
                  echo "VERSION=${GITHUB_REF_NAME#"$DEMO"-v}" >> "$GITHUB_ENV"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Join the two architectures under the version and `latest`
              run: |
                  docker buildx imagetools create \
                      --tag "$IMAGE:$VERSION" \
                      --tag "$IMAGE:latest" \
                      "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
